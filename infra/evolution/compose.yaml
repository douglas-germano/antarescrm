name: antares-evolution

services:
  api:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    restart: unless-stopped
    env_file:
      - ${EVOLUTION_ENV_FILE:?Set EVOLUTION_ENV_FILE to the private runtime .env}
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - instances:/evolution/instances
    networks:
      default:
      integrations:
        aliases: [evolution-api]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.11-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private runtime .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  instances:
  postgres:
  redis:
networks:
  integrations:
    name: antares-integrations
    external: true
